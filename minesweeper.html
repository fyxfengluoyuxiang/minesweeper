<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扫雷 · Minesweeper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c0c0c0'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23111'/%3E%3Cpath d='M16 3v6M6 9l4 4M26 9l-4 4M4 17h5M23 17h5' stroke='%23111' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='12.5' cy='13.5' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --cell: 24px;
    --face: #c0c0c0;
    --hi: #ffffff;
    --lo: #808080;
    --lo2: #000000;
  }
  *{ box-sizing: border-box; }
  html,body{
    height:100%;
    margin:0;
  }
  body{
    background:#008080;
    color:#000;
    font:13px/1.4 "Segoe UI","Microsoft YaHei",Tahoma,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    overflow:auto;
  }
  .app{
    background:var(--face);
    padding:6px;
    width:max-content;
    border:3px solid;
    border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);
    box-shadow:1px 1px 0 var(--lo) inset, -1px -1px 0 #dfdfdf inset, 3px 3px 0 rgba(0,0,0,.35);
  }

  /* ---------- 顶部难度栏 ---------- */
  .toolbar{
    display:flex;
    gap:5px;
    align-items:center;
    flex-wrap:wrap;
    padding:0 0 6px 0;
  }
  .btn{
    font:inherit;
    font-size:12px;
    color:#000;
    background:var(--face);
    padding:2px 7px;
    border:2px solid;
    border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);
    box-shadow:1px 1px 0 var(--lo) inset,-1px -1px 0 #e8e8e8 inset;
    cursor:pointer;
  }
  .btn:active,
  .btn.on{
    border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);
    box-shadow:1px 1px 0 #e8e8e8 inset,-1px -1px 0 var(--lo) inset;
    padding:3px 6px 1px 8px;
  }
  .btn.on{ font-weight:700; }
  .btn.icon{ padding:1px 5px; font-size:14px; line-height:1.2; }
  .btn.icon:active{ padding:2px 4px 0 6px; }
  .spacer{ flex:1; }

  /* ---------- 主体框架 ---------- */
  .frame{
    border:3px solid;
    border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    padding:6px;
    background:var(--face);
  }
  .panel{
    border:2px solid;
    border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    padding:4px 5px;
    margin-bottom:7px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .led{
    background:#000;
    padding:2px 3px;
    border:2px solid;
    border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);
    display:flex;
    gap:2px;
    height:31px;
    align-items:center;
  }
  .digit{ position:relative; width:14px; height:24px; }
  .digit i{
    position:absolute;
    background:#3a0505;
    border-radius:1px;
  }
  .digit i.on{
    background:#ff2f2f;
    box-shadow:0 0 5px #ff4b4b, 0 0 2px #ff9090;
  }
  .digit i.a{ left:4px; top:1px;  width:6px; height:3px; }
  .digit i.b{ left:10px;top:4px;  width:3px; height:7px; }
  .digit i.c{ left:10px;top:13px; width:3px; height:7px; }
  .digit i.d{ left:4px; top:20px; width:6px; height:3px; }
  .digit i.e{ left:1px; top:13px; width:3px; height:7px; }
  .digit i.f{ left:1px; top:4px;  width:3px; height:7px; }
  .digit i.g{ left:4px; top:10px; width:6px; height:3px; }
  .face-btn{
    width:38px; height:38px;
    padding:0;
    background:var(--face);
    border:3px solid;
    border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);
    box-shadow:1px 1px 0 var(--lo) inset,-1px -1px 0 #e8e8e8 inset;
    cursor:pointer;
    display:grid;
    place-items:center;
    line-height:0;
  }
  .face-btn:active{
    border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);
  }

  /* ---------- 棋盘 ---------- */
  .board-wrap{ position:relative; display:flex; justify-content:center; }
  .board{
    border:3px solid;
    border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    display:grid;
    width:max-content;
    background:var(--face);
    touch-action:manipulation;
  }
  .cell{
    width:var(--cell);
    height:var(--cell);
    background:var(--face);
    border:2px solid;
    border-color:var(--hi) var(--lo) var(--lo) var(--hi);
    display:flex;
    align-items:center;
    justify-content:center;
    font:700 calc(var(--cell) * 0.64)/1 "Tahoma",sans-serif;
    cursor:default;
    overflow:hidden;
  }
  .cell.open{
    border:1px solid #b0b0b0;
    border-top-color:#8a8a8a;
    border-left-color:#8a8a8a;
    background:#c8c8c8;
  }
  .cell.open.press{ background:#c0c0c0; }
  .cell svg{ width:70%; height:70%; display:block; pointer-events:none; }
  .cell.flag-cell svg{ width:76%; height:76%; }
  .cell .num{ pointer-events:none; }
  .cell.n1{ color:#0000ff; } .cell.n2{ color:#008000; }
  .cell.n3{ color:#ff0000; } .cell.n4{ color:#000080; }
  .cell.n5{ color:#800000; } .cell.n6{ color:#008080; }
  .cell.n7{ color:#000000; } .cell.n8{ color:#808080; }
  .cell.boom{ background:#ff3b30 !important; }
  .cell.wrong{ position:relative; }
  .cell.wrong::after{
    content:"✕";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:#ff0000;
    font:700 calc(var(--cell)*0.8)/1 Tahoma,sans-serif;
  }

  /* ---------- 结束遮罩 ---------- */
  .overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(1px);
  }
  .overlay.show{ display:flex; }
  .card{
    background:var(--face);
    border:3px solid;
    border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);
    box-shadow:1px 1px 0 var(--lo) inset,-1px -1px 0 #e8e8e8 inset;
    padding:14px 18px;
    text-align:center;
    min-width:190px;
    animation:pop .16s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.86); opacity:.4 } to{ transform:none; opacity:1 } }
  .card h2{ margin:0 0 4px; font-size:19px; }
  .card p{ margin:0 0 12px; color:#333; }
  .card .record{ color:#b8860b; font-weight:700; }

  /* ---------- 底部 ---------- */
  .status{
    border:2px solid;
    border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    margin-top:7px;
    padding:4px 7px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    color:#222;
    font-size:11px;
  }
  .status b{ color:#000; }
  .hint{
    color:rgba(255,255,255,.88);
    font-size:12px;
    text-align:center;
    max-width:640px;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
  }

  /* ---------- 自定义难度 ---------- */
  .custom{
    display:none;
    gap:8px;
    align-items:center;
    padding:0 2px 6px;
    flex-wrap:wrap;
  }
  .custom.show{ display:flex; }
  .custom label{ display:flex; gap:4px; align-items:center; }
  .custom input{
    width:58px;
    font:inherit;
    padding:2px 4px;
    border:2px solid;
    border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    background:#fff;
  }
  .custom input:focus{ outline:2px dotted #000; outline-offset:-4px; }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="btn on" data-diff="beginner">初级</button>
    <button class="btn" data-diff="intermediate">中级</button>
    <button class="btn" data-diff="expert">高级</button>
    <button class="btn" id="customToggle">自定义…</button>
    <span class="spacer"></span>
    <button class="btn icon" id="soundToggle" title="开关音效">🔊</button>
  </div>

  <div class="custom" id="customPanel">
    <label>宽 <input type="number" id="cW" value="12" min="5" max="60"></label>
    <label>高 <input type="number" id="cH" value="12" min="5" max="40"></label>
    <label>雷 <input type="number" id="cM" value="25" min="1" max="999"></label>
    <button class="btn" id="customStart">开始</button>
  </div>

  <div class="frame">
    <div class="panel">
      <div class="led" id="ledMine"></div>
      <button class="face-btn" id="face" title="重新开始 (R)"></button>
      <div class="led" id="ledTime"></div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="ovTitle">🎉 通关！</h2>
          <p id="ovText"></p>
          <button class="btn" id="ovAgain">再来一局 (R)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status">
    <span id="bestLine"></span>
  </div>
</div>
<div class="hint">左键翻开 · 右键插旗 · 双击或中键数字快速展开 · 手机长按插旗 · R 重开</div>

<script>
(function(){
  "use strict";

  /* ================= 配置 ================= */
  var DIFFS = {
    beginner:     { cols: 9,  rows: 9,  mines: 10, label: "初级" },
    intermediate: { cols: 16, rows: 16, mines: 40, label: "中级" },
    expert:       { cols: 30, rows: 16, mines: 99, label: "高级" }
  };
  var BEST_KEY = "minesweeper.best.v1";

  /* ================= 元素 ================= */
  var boardEl  = document.getElementById("board");
  var overlay  = document.getElementById("overlay");
  var ovTitle  = document.getElementById("ovTitle");
  var ovText   = document.getElementById("ovText");
  var ledMine  = document.getElementById("ledMine");
  var ledTime  = document.getElementById("ledTime");
  var faceBtn  = document.getElementById("face");
  var bestLine = document.getElementById("bestLine");
  var customPanel = document.getElementById("customPanel");

  /* ================= 状态 ================= */
  var cols, rows, mineCount;
  var cells = [];        // { idx, mine, adj, state, el }
  var started = false, over = false, won = false;
  var openedCount = 0, flagCount = 0;
  var timerId = null, seconds = 0, frozenTime = 0;
  var currentDiff = "beginner";
  var soundOn = true;

  /* ================= 7 段数码管 ================= */
  var SEG = {
    "0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd",
    "6":"afgecd","7":"abc","8":"abcdefg","9":"abcdfg","-":"g"," ":""
  };
  function buildLed(el, digits){
    el.innerHTML = "";
    for (var d = 0; d < digits; d++){
      var box = document.createElement("div");
      box.className = "digit";
      "abcdefg".split("").forEach(function(s){
        var i = document.createElement("i");
        i.className = s;
        i.dataset.seg = s;
        box.appendChild(i);
      });
      el.appendChild(box);
    }
  }
  function setLed(el, value){
    var str = String(value);
    var sign = "";
    if (str.charAt(0) === "-"){ sign = "-"; str = str.slice(1); }
    var digits = el.children.length - (sign ? 1 : 0);
    str = str.slice(-digits).padStart(digits, "0");
    if (sign) str = "-" + str.slice(1);
    for (var d = 0; d < el.children.length; d++){
      var ch = str.charAt(d);
      var on = SEG[ch] || "";
      var segs = el.children[d].children;
      for (var s = 0; s < segs.length; s++){
        segs[s].classList.toggle("on", on.indexOf(segs[s].dataset.seg) !== -1);
      }
    }
  }

  /* ================= 表情 ================= */
  var FACES = {
    normal:   '<svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="#ffd93b" stroke="#000" stroke-width="1.6"/><ellipse cx="11.4" cy="13" rx="1.5" ry="2.1" fill="#000"/><ellipse cx="20.6" cy="13" rx="1.5" ry="2.1" fill="#000"/><path d="M9.8 20.2c1.8 2.6 4 3.9 6.2 3.9s4.4-1.3 6.2-3.9" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg>',
    surprised:'<svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="#ffd93b" stroke="#000" stroke-width="1.6"/><ellipse cx="11.4" cy="12.4" rx="1.5" ry="2.2" fill="#000"/><ellipse cx="20.6" cy="12.4" rx="1.5" ry="2.2" fill="#000"/><ellipse cx="16" cy="22" rx="3.6" ry="4.4" fill="#000"/></svg>',
    cool:     '<svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="#ffd93b" stroke="#000" stroke-width="1.6"/><path d="M3.6 12.6h24.8v2.2H3.6z" fill="#111"/><rect x="5" y="12" width="9.4" height="6.4" rx="2" fill="#111"/><rect x="17.6" y="12" width="9.4" height="6.4" rx="2" fill="#111"/><path d="M9.8 21.4c1.7 2.4 3.8 3.6 6.2 3.6s4.5-1.2 6.2-3.6" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg>',
    dead:     '<svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="#ffd93b" stroke="#000" stroke-width="1.6"/><path d="M8.6 10.6l4.6 4.6M13.2 10.6l-4.6 4.6" stroke="#000" stroke-width="1.7" stroke-linecap="round"/><path d="M18.8 10.6l4.6 4.6M23.4 10.6l-4.6 4.6" stroke="#000" stroke-width="1.7" stroke-linecap="round"/><path d="M10 23.6c1.7-2.4 3.8-3.6 6-3.6s4.3 1.2 6 3.6" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg>'
  };
  function setFace(kind){ faceBtn.innerHTML = FACES[kind] || FACES.normal; }

  /* ================= 图标 ================= */
  var ICON = {
    flag: '<svg viewBox="0 0 24 24"><path d="M9.6 3.4v17.2" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><path d="M4.8 20.6h12.4" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><path d="M11 4.9l8.2 3.9L11 12.7z" fill="#e01b24" stroke="#7d0a10" stroke-width="1.1" stroke-linejoin="round"/></svg>',
    mine: '<svg viewBox="0 0 24 24"><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22M5.2 5.2l2.4 2.4M16.4 16.4l2.4 2.4M18.8 5.2l-2.4 2.4M7.6 16.4l-2.4 2.4" stroke="#111" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.1" fill="#111"/><circle cx="9.7" cy="9.7" r="1.7" fill="#fff"/></svg>',
    boom: '<svg viewBox="0 0 24 24"><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22M5.2 5.2l2.4 2.4M16.4 16.4l2.4 2.4M18.8 5.2l-2.4 2.4M7.6 16.4l-2.4 2.4" stroke="#7a0000" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.1" fill="#111"/><circle cx="9.7" cy="9.7" r="1.7" fill="#fff"/></svg>'
  };

  /* ================= 音效 ================= */
  var audioCtx = null;
  function beep(freq, dur, type, gain){
    if (!soundOn) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      g.gain.value = gain || 0.045;
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  /* ================= 最佳成绩 ================= */
  function loadBest(){
    try{ return JSON.parse(localStorage.getItem(BEST_KEY) || "{}"); }catch(e){ return {}; }
  }
  function saveBest(obj){
    try{ localStorage.setItem(BEST_KEY, JSON.stringify(obj)); }catch(e){}
  }
  function diffKey(){
    if (currentDiff && DIFFS[currentDiff]) return currentDiff;
    return "custom";
  }
  function renderBest(){
    var b = loadBest();
    var parts = [];
    ["beginner","intermediate","expert"].forEach(function(k){
      if (b[k] != null) parts.push(DIFFS[k].label + " <b>" + b[k] + "</b> 秒");
    });
    bestLine.innerHTML = parts.length ? "最佳：" + parts.join(" · ") : "最佳：暂无记录";
  }

  /* ================= 计时 ================= */
  function startTimer(){
    stopTimer();
    seconds = 0;
    setLed(ledTime, 0);
    timerId = setInterval(function(){
      seconds = Math.min(seconds + 1, 999);
      setLed(ledTime, seconds);
    }, 1000);
  }
  function stopTimer(){
    if (timerId){ clearInterval(timerId); timerId = null; }
  }

  /* ================= 新局 ================= */
  function newGame(cfg){
    if (cfg){
      cols = cfg.cols; rows = cfg.rows; mineCount = cfg.mines;
      currentDiff = cfg.diff || "custom";
    }
    cols = Math.max(5, Math.min(60, cols | 0));
    rows = Math.max(5, Math.min(40, rows | 0));
    mineCount = Math.max(1, Math.min(cols * rows - 9, mineCount | 0));

    stopTimer();
    started = false; over = false; won = false;
    openedCount = 0; flagCount = 0; seconds = 0; frozenTime = 0;
    setFace("normal");
    overlay.classList.remove("show");
    setLed(ledTime, 0);
    setLed(ledMine, mineCount);

    cells = [];
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", var(--cell))";
    var frag = document.createDocumentFragment();
    for (var i = 0; i < cols * rows; i++){
      var el = document.createElement("div");
      el.className = "cell";
      el.dataset.i = i;
      var obj = { idx: i, mine: false, adj: 0, state: "hidden", el: el };
      cells.push(obj);
      frag.appendChild(el);
    }
    boardEl.appendChild(frag);

    fitLayout();
    renderBest();
  }

  function fitLayout(){
    var maxW = Math.min(window.innerWidth - 70, 1180);
    var maxH = window.innerHeight - 260;
    var size = Math.floor(Math.min(maxW / cols, maxH / rows));
    size = Math.max(16, Math.min(30, size));
    document.documentElement.style.setProperty("--cell", size + "px");

    // 窗口宽度紧贴棋盘：网格 + 棋盘边框6 + frame内边距与边框18 + app内边距与边框18
    var appW = cols * size + 42;
    document.querySelector(".app").style.width = Math.max(262, Math.round(appW)) + "px";
  }

  /* ================= 布雷（首点必安全） ================= */
  function placeMines(safeIndex){
    var safe = {};
    var sx = safeIndex % cols, sy = Math.floor(safeIndex / cols);
    for (var dy = -1; dy <= 1; dy++){
      for (var dx = -1; dx <= 1; dx++){
        var nx = sx + dx, ny = sy + dy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) safe[ny * cols + nx] = true;
      }
    }
    var pool = [];
    for (var i = 0; i < cols * rows; i++) if (!safe[i]) pool.push(i);
    // 若空间不足（极小棋盘），退化为只保护首格
    if (pool.length < mineCount){
      pool = [];
      for (var j = 0; j < cols * rows; j++) if (j !== safeIndex) pool.push(j);
    }
    for (var k = pool.length - 1; k > 0; k--){
      var r = Math.floor(Math.random() * (k + 1));
      var t = pool[k]; pool[k] = pool[r]; pool[r] = t;
    }
    for (var m = 0; m < mineCount; m++) cells[pool[m]].mine = true;

    for (var c = 0; c < cells.length; c++){
      if (cells[c].mine) continue;
      cells[c].adj = neighbors(c).filter(function(n){ return n.mine; }).length;
    }
  }

  function neighbors(i){
    var x = i % cols, y = (i - x) / cols, out = [];
    for (var dy = -1; dy <= 1; dy++){
      for (var dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        var nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) out.push(cells[ny * cols + nx]);
      }
    }
    return out;
  }

  /* ================= 渲染单元格 ================= */
  function paint(cell){
    var el = cell.el;
    el.className = "cell";
    el.innerHTML = "";
    if (cell.state === "flag"){
      el.innerHTML = ICON.flag;
      el.classList.add("flag-cell");
    } else if (cell.state === "qmark"){
      el.innerHTML = '<span class="num" style="color:#000">?</span>';
    } else if (cell.state === "open"){
      el.classList.add("open");
      if (cell.mine){
        el.innerHTML = ICON.mine;
      } else if (cell.adj > 0){
        el.innerHTML = '<span class="num">' + cell.adj + "</span>";
        el.classList.add("n" + cell.adj);
      }
    }
    if (cell.wrong) el.classList.add("wrong");
  }

  /* ================= 翻开 ================= */
  function reveal(i){
    var cell = cells[i];
    if (!cell || over || cell.state === "flag" || cell.state === "qmark" || cell.state === "open") return;

    if (!started){
      started = true;
      placeMines(i);
      startTimer();
    }
    if (cell.mine){ lose(i); return; }

    // 洪水填充
    var stack = [i];
    var openedNow = 0;
    while (stack.length){
      var cur = cells[stack.pop()];
      if (cur.state === "open" || cur.state === "flag") continue;
      cur.state = "open";
      cur.el.classList.remove("press");
      paint(cur);
      openedNow++;
      if (cur.adj === 0 && !cur.mine){
        neighbors(cur.idx).forEach(function(n){
          if (n.state === "hidden" || n.state === "qmark") stack.push(n.idx);
        });
      }
    }
    openedCount += openedNow;
    beep(320 + Math.min(openedNow, 8) * 40, 0.05, "triangle", 0.03);
    checkWin();
  }

  function toggleFlag(i){
    var cell = cells[i];
    if (!cell || over || cell.state === "open") return;
    if (cell.state === "hidden"){
      cell.state = "flag";
      flagCount++;
      beep(760, 0.05, "square", 0.035);
    } else if (cell.state === "flag"){
      cell.state = "qmark";
      flagCount--;
      beep(520, 0.045, "square", 0.03);
    } else {
      cell.state = "hidden";
    }
    paint(cell);
    setLed(ledMine, mineCount - flagCount);
  }

  function chord(i){
    var cell = cells[i];
    if (!cell || over || cell.state !== "open" || cell.adj === 0) return;
    var nb = neighbors(i);
    var flags = nb.filter(function(n){ return n.state === "flag"; }).length;
    if (flags !== cell.adj) return;
    nb.forEach(function(n){
      if (n.state === "hidden" || n.state === "qmark"){
        if (n.mine){ lose(n.idx); }
        else if (!over){ reveal(n.idx); }
      }
    });
  }

  /* ================= 结束 ================= */
  function revealAllMines(boomIndex){
    cells.forEach(function(c, idx){
      if (c.mine && c.state !== "flag"){
        c.state = "open";
        paint(c);
        if (idx === boomIndex){
          c.el.classList.add("boom");
        }
      } else if (!c.mine && c.state === "flag"){
        c.wrong = true;
        paint(c);
      }
    });
  }

  function lose(boomIndex){
    over = true;
    stopTimer();
    frozenTime = seconds;
    setFace("dead");
    revealAllMines(boomIndex);
    beep(180, 0.5, "sawtooth", 0.06);
    setTimeout(function(){ beep(110, 0.6, "sawtooth", 0.05); }, 110);
    ovTitle.textContent = "💥 踩雷了";
    ovText.innerHTML = "用时 " + seconds + " 秒 · 已翻开 " + openedCount + " 格";
    overlay.classList.add("show");
  }

  function checkWin(){
    if (openedCount !== cols * rows - mineCount) return;
    over = true; won = true;
    stopTimer();
    frozenTime = seconds;
    setFace("cool");
    cells.forEach(function(c){
      if (c.mine && c.state !== "flag"){ c.state = "flag"; paint(c); }
    });
    flagCount = mineCount;
    setLed(ledMine, 0);
    beep(660, 0.09, "square", 0.05);
    setTimeout(function(){ beep(880, 0.12, "square", 0.05); }, 100);
    setTimeout(function(){ beep(1180, 0.18, "square", 0.05); }, 230);

    var key = diffKey();
    var b = loadBest();
    var isRecord = !!DIFFS[key] && (b[key] == null || seconds < b[key]);
    if (isRecord){ b[key] = seconds; saveBest(b); }
    renderBest();

    ovTitle.textContent = "🎉 全部排雷完成";
    ovText.innerHTML = DIFFS[key]
      ? "用时 " + seconds + " 秒" + (isRecord ? ' · <span class="record">新纪录！</span>' : "")
      : "用时 " + seconds + " 秒（自定义局不记入最佳）";
    overlay.classList.add("show");
  }

  /* ================= 交互 ================= */
  var holding = -1, hIdx = -1, lastTouch = 0;

  boardEl.addEventListener("mousedown", function(e){
    if (Date.now() - lastTouch < 700) return;
    var el = e.target.closest ? e.target.closest(".cell") : null;
    if (!el) return;
    var i = +el.dataset.i;
    if (e.button === 2){ e.preventDefault(); toggleFlag(i); return; }
    if (e.button === 0){
      if (!over){ setFace("surprised"); holding = i; hIdx = i; }
      var c = cells[i];
      if (c && c.state === "hidden") el.classList.add("press");
    }
    if (e.button === 1){ e.preventDefault(); chord(i); }
  });

  boardEl.addEventListener("mouseup", function(e){
    if (Date.now() - lastTouch < 700) return;
    if (e.button !== 0) return;
    var el = e.target.closest ? e.target.closest(".cell") : null;
    var i = el ? +el.dataset.i : -1;
    if (hIdx >= 0) cells[hIdx].el.classList.remove("press");
    if (!over) setFace("normal");
    var pressedSame = (holding === i);
    holding = -1; hIdx = -1;
    if (i >= 0 && pressedSame) reveal(i);
  });

  boardEl.addEventListener("mouseleave", function(){
    if (hIdx >= 0) cells[hIdx].el.classList.remove("press");
    holding = -1; hIdx = -1;
    if (!over) setFace("normal");
  });

  boardEl.addEventListener("dblclick", function(e){
    if (Date.now() - lastTouch < 700) return;
    var el = e.target.closest ? e.target.closest(".cell") : null;
    if (el) chord(+el.dataset.i);
  });

  boardEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  // 移动端：长按插旗
  var touchTimer = null;
  boardEl.addEventListener("touchstart", function(e){
    if (over) return;
    var el = e.target.closest ? e.target.closest(".cell") : null;
    if (!el) return;
    lastTouch = Date.now();
    var i = +el.dataset.i;
    hIdx = i; holding = i;
    if (!over) setFace("surprised");
    touchTimer = setTimeout(function(){
      touchTimer = null;
      lastTouch = Date.now();
      toggleFlag(i);
      if (navigator.vibrate) navigator.vibrate(12);
      holding = -1; hIdx = -1;
      setFace("normal");
    }, 420);
  }, { passive: true });

  boardEl.addEventListener("touchend", function(e){
    if (touchTimer){
      clearTimeout(touchTimer); touchTimer = null;
      if (hIdx >= 0) cells[hIdx].el.classList.remove("press");
      var i = holding;
      holding = -1; hIdx = -1;
      setFace("normal");
      if (i >= 0) reveal(i);
    }
  }, { passive: true });

  boardEl.addEventListener("touchmove", function(){
    if (touchTimer){ clearTimeout(touchTimer); touchTimer = null; }
    if (hIdx >= 0) cells[hIdx].el.classList.remove("press");
    holding = -1; hIdx = -1;
    if (!over) setFace("normal");
  }, { passive: true });

  /* ================= 控件 ================= */
  faceBtn.addEventListener("click", function(){ newGame(); });
  document.getElementById("ovAgain").addEventListener("click", function(){ newGame(); });

  var diffButtons = Array.prototype.slice.call(document.querySelectorAll("[data-diff]"));
  diffButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      setActiveDiff(btn.dataset.diff);
      customPanel.classList.remove("show");
      var d = DIFFS[btn.dataset.diff];
      newGame({ cols: d.cols, rows: d.rows, mines: d.mines, diff: btn.dataset.diff });
    });
  });
  function setActiveDiff(name){
    diffButtons.forEach(function(b){ b.classList.toggle("on", b.dataset.diff === name); });
  }

  document.getElementById("customToggle").addEventListener("click", function(){
    customPanel.classList.toggle("show");
  });
  document.getElementById("customStart").addEventListener("click", function(){
    var w = parseInt(document.getElementById("cW").value, 10) || 12;
    var h = parseInt(document.getElementById("cH").value, 10) || 12;
    var m = parseInt(document.getElementById("cM").value, 10) || 20;
    w = Math.max(5, Math.min(60, w));
    h = Math.max(5, Math.min(40, h));
    m = Math.max(1, Math.min(w * h - 9, m));
    document.getElementById("cW").value = w;
    document.getElementById("cH").value = h;
    document.getElementById("cM").value = m;
    setActiveDiff(null);
    customPanel.classList.remove("show");
    newGame({ cols: w, rows: h, mines: m, diff: "custom" });
  });

  var soundBtn = document.getElementById("soundToggle");
  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.title = soundOn ? "音效已开（点击静音）" : "已静音（点击开启音效）";
    if (soundOn) beep(700, 0.06, "square", 0.04);
  });

  document.addEventListener("keydown", function(e){
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "r"){ newGame(); }
    else if (k === "1"){ diffButtons[0].click(); }
    else if (k === "2"){ diffButtons[1].click(); }
    else if (k === "3"){ diffButtons[2].click(); }
  });

  window.addEventListener("resize", fitLayout);

  /* ================= 启动 ================= */
  buildLed(ledMine, 3);
  buildLed(ledTime, 3);
  setFace("normal");
  newGame({ cols: 9, rows: 9, mines: 10, diff: "beginner" });
})();
</script>
</body>
</html>
